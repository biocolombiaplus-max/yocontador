<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #14b8b6 0%, #0EA5A4 45%, #0b7f7e 100%);
    font-family: Arial, Helvetica, sans-serif;
  }
  .mark {
    color: #ffffff;
    font-weight: 800;
    font-size: 160px;
    letter-spacing: -4px;
    transform: translateY(4px);
  }
</style>
</head>
<body>
  <div class="icon" id="icon">
    <span class="mark">BC</span>
  </div>
</body>
</html>
